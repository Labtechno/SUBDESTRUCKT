# SUBDESTRUCKT — ARCH-UI-04-R2-B2 — preuves macOS de l'intégration en production (TB2-06).
# Compile la cible de tests du wrapper (code de production réel, JUCE 9.0.6 épinglé) sur macOS 15 arm64 (VM GitHub :
# comparatif, NON certifiant, ce n'est ni une recette physique ni une recette dans Reason), exécute la suite du wrapper
# avec les reproductions B2 (tests/wrapper/GestureTests.cpp) et verse les journaux bruts dans
# docs/ARCH-UI-04-R2/B2-PRODUCTION-INTEGRATION/PB/macos/ par un commit [skip ci]. Aucun binaire n'est publié.
# La CI de production (arch-g4.yml, inchangée) reste le juge du verdict : elle exécute les mêmes tests et la barrière.
name: R2-B2 preuves macOS (macos-15, wrapper)

on:
  push:
    branches: [feature/arch-g4-full-development]
    paths:
      - "tests/wrapper/**"
      - "ui/**"
      - ".github/workflows/r2b2-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r2b2-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_TAG: "9.0.6"
  JUCE_SHA: "654bdbc7a9db0dae90849b44abe91f339e9f0768"
  DEST: docs/ARCH-UI-04-R2/B2-PRODUCTION-INTEGRATION/PB/macos

jobs:
  evidence:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: JUCE 9.0.6 (commit épinglé)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          test "$(git -C "$RUNNER_TEMP/JUCE" rev-parse HEAD)" = "$JUCE_SHA"

      - name: Compilation Release arm64 (tests du wrapper)
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUBDESTRUCKT_JUCE_DIR="$RUNNER_TEMP/JUCE" > /dev/null
          cmake --build build --target subdestruckt_wrapper_tests

      - name: Suite du wrapper avec journaux de reproduction
        run: |
          set +e -o pipefail
          mkdir -p out/pb
          {
            echo "run     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit  : ${{ github.sha }}"
            echo "macOS   : $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m), VM GitHub"
          } | tee out/pb/machine.txt
          SBD_B2_OUT="$PWD/out/pb" ./build/subdestruckt_wrapper_tests_artefacts/Release/subdestruckt_wrapper_tests tests/host/expected_vst3_param_ids.txt 2>&1 | tee out/wrapper.log
          code="${PIPESTATUS[0]}"
          grep -a '^RESULT ' out/wrapper.log > out/pb/wrapper-results.txt
          bash tools/check_results.sh tests/expected_results.txt tests/known_failures.txt "wrapper=out/wrapper.log:$code" | tee out/pb/barrier.txt
          test -s out/pb/pb-summary.csv

      - name: Versement des résultats macOS (commit [skip ci])
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          cp out/pb/* "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "aucun changement"; exit 0; fi
          git commit -q -m "docs(ARCH-UI-04-R2-B2): preuves macOS du wrapper (run ${{ github.run_number }}) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Artefact (journaux)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r2b2-evidence-macos-${{ github.run_number }}
          path: out/
          retention-days: 30
