# SUBDESTRUCKT — Component Lab (NON PRODUCTION) — R2-B1 / B1-R1, puis R2-B2 (peintres partagés ui/r2/).
# Compile le laboratoire isolé (lab/ ; depuis R2-B2, il consomme les peintres partagés du Design System R1 dans ui/r2/),
# exécute les mesures typographiques PT-02, la validation des glyphes PT-05, les contrastes, les auto-tests de gestes et
# les rendus de planches sur macOS 15 arm64 (VM GitHub, rendu logiciel JUCE hors écran : ce n'est PAS une recette physique).
#
# Depuis R2-B2 (CE-B2-03), les captures R1 historiques de docs/ARCH-UI-04-R2/B1-R1-FINAL-ARTISTIC-REFINEMENT/CAPTURES/macos/
# sont des références INDÉPENDANTES et IMMUABLES : ce workflow ne les réécrit plus. Il compare les planches rendues avec
# les peintres partagés à ces références (images entières, rendu avec la chaîne de SHA de la référence) et verse les
# résultats de comparaison et les mesures dans docs/ARCH-UI-04-R2/B2-PRODUCTION-INTEGRATION/VIS/lab/macos/ par un commit
# [skip ci]. Aucun binaire n'est publié ; le plugin n'est pas construit ici (arch-g4.yml inchangé).
#
# Depuis R2-B2-03 : étape 2 de CE-B2-03 (VIS-01). Les planches historiques sont reconstruites et chaque composant R1 du
# laboratoire visé est remplacé par le composant de PRODUCTION lié au paramètre réel ; lab/tools/vis01_compare.py compare
# le résultat aux références historiques (contrôle hors substitution, contrôle différentiel). Résultats versés dans
# docs/ARCH-UI-04-R2/B2-PRODUCTION-INTEGRATION/VIS/b2-03/macos/. Le verdict VIS-01 est appliqué APRÈS le versement.
name: R2-B1 Component Lab (macos-15, non-production)

on:
  push:
    branches: [feature/arch-g4-full-development]
    paths:
      - "lab/**"
      - "ui/**"
      - ".github/workflows/component-lab.yml"

permissions:
  contents: write

concurrency:
  group: component-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_TAG: "9.0.6"
  JUCE_SHA: "654bdbc7a9db0dae90849b44abe91f339e9f0768"
  DEST: docs/ARCH-UI-04-R2/B2-PRODUCTION-INTEGRATION/VIS/lab/macos
  DEST_VIS: docs/ARCH-UI-04-R2/B2-PRODUCTION-INTEGRATION/VIS/b2-03/macos
  B1: docs/ARCH-UI-04-R2/B1-COMPONENT-LAB
  # chaîne de SHA inscrite dans le bandeau des captures R1 historiques macOS (component-lab run 5, commit 7cbfa43)
  R1_REF_SHA: "7cbfa43"

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: JUCE 9.0.6 (commit épinglé)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          test "$(git -C "$RUNNER_TEMP/JUCE" rev-parse HEAD)" = "$JUCE_SHA"

      - name: Compilation du laboratoire (Release arm64)
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          cmake -S lab -B build-lab -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUBDESTRUCKT_JUCE_DIR="$RUNNER_TEMP/JUCE"
          cmake --build build-lab

      - name: Campagne (planches, PT-02, PT-05, contrastes, auto-tests, comparatif 0.4.1 / R2)
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit   : ${{ github.sha }}"
            echo "macOS    : $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m), VM GitHub"
          } | tee out/machine.txt
          ./build-lab/sbd_component_lab_artefacts/Release/sbd_component_lab --all out --csv docs/ARCH-UI-04-R2/R2-CONTROL-LABELS-R1.csv --scale 2 --b1 "$B1/CAPTURES/macos" --sha "${GITHUB_SHA::7}" | tee out/lab-stdout.txt
          ./build-lab/sbd_lab_compare_artefacts/Release/sbd_lab_compare out/CAPTURES/12-compare-041-r2.png 2 | tee -a out/lab-stdout.txt
          grep -q "SELFTEST .* 0 FAIL" out/lab-stdout.txt
          grep -q "NONREG 02-nexus.png .*IDENTIQUE" out/lab-stdout.txt
          grep -q "NONREG 06-plasma-channel.png .*IDENTIQUE" out/lab-stdout.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comparaison aux références R1 historiques (CE-B2-03, étape 1)
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pillow
          # (a) planches de la campagne (bandeau d'en-tête exclu : il porte le SHA du code de rendu)
          python lab/tools/compare_r1_refs.py out/CAPTURES macos out/compare-r1-hors-bandeau.csv | tee out/compare-r1.txt || true
          # (b) contrôle strict : rendu avec la chaîne de SHA de la référence, images entières comparées
          mkdir -p out-strict
          ./build-lab/sbd_component_lab_artefacts/Release/sbd_component_lab --all out-strict --csv docs/ARCH-UI-04-R2/R2-CONTROL-LABELS-R1.csv --scale 2 --b1 "$B1/CAPTURES/macos" --sha "$R1_REF_SHA" > out/strict-stdout.txt
          ./build-lab/sbd_lab_compare_artefacts/Release/sbd_lab_compare out-strict/CAPTURES/12-compare-041-r2.png 2 >> out/strict-stdout.txt
          python lab/tools/compare_r1_refs.py out-strict/CAPTURES macos out/compare-r1-images-entieres.csv --header=0 | tee -a out/compare-r1.txt

      - name: VIS-01 (CE-B2-03, étape 2) — composants de production / références R1 historiques
        run: |
          # le shell des étapes s'exécute avec -e : désactivé ici pour que les résultats soient TOUJOURS versés ; le verdict
          # est appliqué après le versement (étape « Verdict VIS-01 »)
          set +e
          set -uo pipefail
          T=./build-lab/sbd_lab_compare_artefacts/Release/sbd_lab_compare
          V=out/vis01
          # la planche 12 historique ne porte pas de SHA ; les autres portent celui de la référence ; une planche par processus
          $T --vis01 "$V" --only 12 | tee out/vis01-render.txt
          for s in 01 06a 11 09; do $T --vis01 "$V" --sha "$R1_REF_SHA" --only "$s" --b1 "$B1/CAPTURES/macos" | tee -a out/vis01-render.txt; done
          python lab/tools/vis01_compare.py "$V" macos "$V/cmp" --outil="$T" --sha="$R1_REF_SHA" --b1="$B1/CAPTURES/macos" | tee out/vis01.txt
          echo "${PIPESTATUS[0]}" > out/vis01-rc.txt
          cat out/vis01-rc.txt
          exit 0

      - name: Versement des résultats macOS (commit [skip ci])
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          cp out/compare-r1.txt out/compare-r1-hors-bandeau.csv out/compare-r1-images-entieres.csv "$DEST/"
          cp out/typography-measurements.csv out/glyphs.csv out/contrast.csv out/panic-contrast.csv out/lab-run.log out/machine.txt "$DEST/"
          # un dossier par run : deux runs concurrents ne réécrivent jamais les mêmes fichiers
          run_dir="$DEST_VIS/run${{ github.run_number }}-${GITHUB_SHA::7}"
          mkdir -p "$run_dir"
          if [ -d out/vis01/cmp ]; then cp -r out/vis01/cmp/. "$run_dir/"; fi
          for f in out/vis01/vis01-cases.csv out/vis01-render.txt out/vis01.txt out/vis01-rc.txt out/machine.txt; do
            if [ -f "$f" ]; then cp "$f" "$run_dir/"; fi
          done
          git add "$DEST_VIS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "aucun changement"; exit 0; fi
          git commit -q -m "docs(ARCH-UI-04-R2-B2): comparaison du Component Lab aux references R1 macOS (run ${{ github.run_number }}) [skip ci]"
          for i in 1 2 3; do
            # conflit sur les résultats de la comparaison d'étape 1 (même dossier pour tous les runs) : version de ce run
            git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Verdict VIS-01 (après versement)
        run: |
          set -euo pipefail
          test "$(cat out/vis01-rc.txt)" = "0"

      - name: Artefact (journaux et planches)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: component-lab-macos-${{ github.run_number }}
          path: out/
          retention-days: 30
