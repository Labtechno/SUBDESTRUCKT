# SUBDESTRUCKT — ARCH-UI-04-R2-B1 — Component Lab (NON PRODUCTION).
# Compile le laboratoire isolé (lab/, projet CMake séparé), exécute les mesures typographiques PT-02, la validation des
# glyphes PT-05, les contrastes, les auto-tests de gestes et les rendus de planches sur macOS 15 arm64 (VM GitHub,
# rendu logiciel JUCE hors écran : ce n'est PAS une recette physique macOS), puis verse les résultats dans
# docs/ARCH-UI-04-R2/B1-COMPONENT-LAB/ par un commit [skip ci]. Aucun binaire n'est publié. Le plugin n'est pas construit
# ici (workflow arch-g4.yml inchangé).
name: R2-B1 Component Lab (macos-15, non-production)

on:
  push:
    branches: [feature/arch-g4-full-development]
    paths:
      - "lab/**"
      - ".github/workflows/component-lab.yml"

permissions:
  contents: write

concurrency:
  group: component-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  JUCE_TAG: "9.0.6"
  JUCE_SHA: "654bdbc7a9db0dae90849b44abe91f339e9f0768"
  DEST: docs/ARCH-UI-04-R2/B1-COMPONENT-LAB

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: JUCE 9.0.6 (commit épinglé)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          test "$(git -C "$RUNNER_TEMP/JUCE" rev-parse HEAD)" = "$JUCE_SHA"

      - name: Compilation du laboratoire (Release arm64)
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || brew install ninja
          cmake -S lab -B build-lab -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUBDESTRUCKT_JUCE_DIR="$RUNNER_TEMP/JUCE"
          cmake --build build-lab

      - name: Campagne (planches, PT-02, PT-05, contrastes, auto-tests, comparatif 0.4.1 / R2)
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit   : ${{ github.sha }}"
            echo "macOS    : $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m), VM GitHub"
          } | tee out/machine.txt
          ./build-lab/sbd_component_lab_artefacts/Release/sbd_component_lab --all out --csv docs/ARCH-UI-04-R2/R2-CONTROL-LABELS-PROPOSALS.csv --scale 2 | tee out/lab-stdout.txt
          ./build-lab/sbd_lab_compare_artefacts/Release/sbd_lab_compare out/CAPTURES/11-compare-041-r2.png 2 | tee -a out/lab-stdout.txt
          ./build-lab/sbd_component_lab_artefacts/Release/sbd_component_lab --contact out/CAPTURES out/contact-sheet-macos.png | tee -a out/lab-stdout.txt
          grep -q "SELFTEST .* 0 FAIL" out/lab-stdout.txt

      - name: Versement des résultats macOS (commit [skip ci])
        run: |
          set -euo pipefail
          mkdir -p "$DEST/CAPTURES/macos" "$DEST/data/macos" "$DEST/CONTACT-SHEETS"
          cp out/CAPTURES/*.png "$DEST/CAPTURES/macos/"
          cp out/contact-sheet-macos.png "$DEST/CONTACT-SHEETS/"
          cp out/typography-measurements.csv out/glyphs.csv out/contrast.csv out/lab-run.log out/machine.txt "$DEST/data/macos/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/CAPTURES/macos" "$DEST/data/macos" "$DEST/CONTACT-SHEETS/contact-sheet-macos.png"
          if git diff --cached --quiet; then echo "aucun changement"; exit 0; fi
          git commit -q -m "docs(ARCH-UI-04-R2-B1): rendus et mesures macOS du Component Lab (run ${{ github.run_number }}) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Artefact (journaux)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: component-lab-macos-${{ github.run_number }}
          path: out/
          retention-days: 30
